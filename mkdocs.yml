site_name: wtf
site_description: A browser-like terminal for macOS and Linux.
site_url: https://koavan.github.io/wtf-terminal-site/
repo_url: https://github.com/koavan/wtf-terminal
repo_name: koavan/wtf-terminal

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Install: install.md
  - Getting started:
      - Welcome: manual/getting-started.md
      - Keyboard shortcuts: manual/shortcuts.md
      - Settings and themes: manual/settings.md
      - Troubleshooting: manual/troubleshooting.md
  - Terminal:
      - Tabs and tab groups: manual/tabs.md
      - Split panes: manual/panes.md
      - Sessions and windows: manual/sessions.md
      - Workspaces: manual/workspaces.md
      - The side pane: manual/side-pane.md
      - Commands, prompts and output: manual/shell-integration.md
      - Pinned output: manual/pins.md
      - Find: manual/find.md
      - History: manual/history.md
      - Snippets and runbooks: manual/snippets.md
      - Broadcast input: manual/broadcast.md
      - Logs in the output: manual/logs.md
      - Recording and saving: manual/recording.md
      - Share & Record: manual/share.md
      - Address bar and context badges: manual/context-badges.md
  - SSH:
      - SSH hosts: manual/ssh-hosts.md
      - SSH keys and ssh-agent: manual/ssh-keys.md
      - Host keys: manual/ssh-host-keys.md
      - SSH tunnels: manual/ssh-tunnels.md
      - Copying files over SSH: manual/ssh-files.md
  - Git, Kubernetes and cloud:
      - Git identities: manual/git-identities.md
      - Worktrees: manual/worktrees.md
      - Kubernetes contexts: manual/kube-contexts.md
      - Kubernetes resources: manual/kubernetes.md
      - AWS profiles: manual/aws.md
      - Cloud secrets: manual/cloud-secrets.md
  - AI:
      - AI assistance: manual/ai.md
      - Agents (Claude Code, Codex): manual/agents.md
      - Ask Claude: manual/ask-claude.md
  - Tools:
      - Command-line tools: manual/tools.md
      - Files: manual/files.md
      - Processes: manual/processes.md
      - Network: manual/network.md
      - Resource usage: manual/usage.md
      - API requests: manual/api.md
      - Tokens and certificates: manual/inspect.md
      - Generate keys and passwords: manual/generate.md
  - Privacy and security:
      - Privacy and safety: manual/privacy.md
      - Hide secrets: manual/secrets.md
      - Findings: manual/findings.md
